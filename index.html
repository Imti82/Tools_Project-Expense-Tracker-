<!DOCTYPE html>
<head>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
</head>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: "class" };</script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen text-slate-800 dark:text-slate-100">
  <div class="max-w-6xl mx-auto p-4 sm:p-6">

    <!-- Header -->
    <header class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <div>
        <h1 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-indigo-500 to-fuchsia-500">💰 Expense Tracker</h1>
        <p class="text-sm opacity-70">Know where your money goes</p>
      </div>
      <div class="flex items-center gap-2">
        <select id="currency" class="field !w-auto">
          <option value="$">$ USD</option><option value="৳">৳ BDT</option>
          <option value="€">€ EUR</option><option value="£">£ GBP</option><option value="₹">₹ INR</option>
        </select>
        <button id="export" class="btn-ghost" title="Download CSV">⬇ CSV</button>
        <button id="theme" class="btn-ghost" title="Toggle dark mode">🌙</button>
      </div>
    </header>

    <!-- Summary -->
    <section class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      <div class="glass card p-5 border-l-4 border-indigo-500">
        <p class="text-sm opacity-70">Balance</p><p id="balance" class="text-2xl font-bold">0.00</p>
      </div>
      <div class="glass card p-5 border-l-4 border-green-500">
        <p class="text-sm opacity-70">Income</p><p id="income" class="text-2xl font-bold text-green-500">0.00</p>
      </div>
      <div class="glass card p-5 border-l-4 border-red-500">
        <p class="text-sm opacity-70">Expenses</p><p id="expense" class="text-2xl font-bold text-red-500">0.00</p>
      </div>
      <div class="glass card p-5 border-l-4 border-amber-500">
        <div class="flex items-center justify-between">
          <p class="text-sm opacity-70">Monthly budget</p>
          <input id="budgetInput" type="number" min="0" placeholder="Set" class="field !w-20 !py-0.5 text-sm" />
        </div>
        <div class="h-2 rounded-full bg-slate-300/60 dark:bg-slate-600 mt-3 overflow-hidden">
          <div id="budgetBar" class="h-full rounded-full bar" style="width:0%"></div>
        </div>
        <p id="budgetText" class="text-xs mt-2 opacity-80">No budget set</p>
      </div>
    </section>

    <div class="grid lg:grid-cols-5 gap-6">

      <!-- Left column -->
      <div class="lg:col-span-2 space-y-6">
        <section class="glass p-5">
          <h2 id="formTitle" class="text-lg font-semibold mb-4">Add Transaction</h2>
          <form id="form" class="space-y-3">
            <input id="title" type="text" maxlength="40" placeholder="Title (e.g. Lunch)" class="field" />
            <input id="amount" type="number" step="0.01" placeholder="Amount" class="field" />
            <div class="grid grid-cols-2 gap-3">
              <select id="type" class="field"><option value="expense">Expense</option><option value="income">Income</option></select>
              <select id="category" class="field"></select>
            </div>
            <input id="date" type="date" class="field" />
            <p id="error" class="text-sm text-red-500 hidden"></p>
            <div class="flex gap-2">
              <button id="submitBtn" type="submit" class="btn-primary flex-1">Add Transaction</button>
              <button id="cancelEdit" type="button" class="btn-ghost hidden">Cancel</button>
            </div>
          </form>
        </section>

        <section class="glass p-5">
          <h2 class="text-lg font-semibold mb-4">Spending by Category</h2>
          <div class="flex items-center gap-5 flex-wrap justify-center">
            <div id="donut" class="donut"><div class="donut-hole"><span id="donutTotal"></span></div></div>
            <ul id="legend" class="text-sm space-y-1"></ul>
          </div>
        </section>
      </div>

      <!-- Right column -->
      <section class="lg:col-span-3 glass p-5">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-semibold">Transactions <span id="count" class="text-sm opacity-60"></span></h2>
          <button id="clear" class="text-sm text-red-500 hover:underline">Clear all</button>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 mb-4">
          <input id="search" type="text" placeholder="🔍 Search" class="field col-span-2 sm:col-span-2" />
          <select id="fType" class="field"><option value="all">All types</option><option value="income">Income</option><option value="expense">Expense</option></select>
          <select id="fCategory" class="field"></select>
          <input id="month" type="month" class="field" />
          <select id="sort" class="field col-span-2 sm:col-span-5">
            <option value="new">Sort: Newest first</option><option value="old">Sort: Oldest first</option>
            <option value="high">Sort: Highest amount</option><option value="low">Sort: Lowest amount</option>
          </select>
        </div>

        <ul id="list" class="space-y-2 max-h-[34rem] overflow-y-auto pr-1"></ul>
        <div id="empty" class="text-center py-10 opacity-70">
          <p class="text-4xl mb-2">🧾</p><p>No transactions found.</p>
          <button id="sample" class="mt-3 text-indigo-500 hover:underline text-sm">Load sample data</button>
        </div>
      </section>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
